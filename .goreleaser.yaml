version: 2

project_name: appc

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    main: ./main.go
    binary: appc
    ldflags:
      - -s -w -X github.com/tadaken3/appc/cmd.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.ja.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

brews:
  - name: appc
    repository:
      owner: tadaken3
      name: homebrew-appc
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/tadaken3/appc"
    description: "App Store Connect API CLI tool"
    license: "MIT"
    test: |
      system "#{bin}/appc", "--help"
    install: |
      bin.install "appc"
